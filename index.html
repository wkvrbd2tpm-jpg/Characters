<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラクター図鑑</title>
<meta name="description" content="オリジナルキャラクターの紹介ページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1 id="site-title">キャラクター図鑑</h1>
    <p id="site-lead"></p>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input type="search" id="q" placeholder="名前やタグで探す" aria-label="キャラクターを検索">
    <div class="chips" id="chips" aria-label="タグで絞り込み"></div>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap">掲載しているキャラクターはすべて成人(18歳以上)の設定です。無断転載・無断使用はご遠慮ください。</div>
</footer>

<dialog id="dlg" aria-label="キャラクター詳細">
  <button class="close" id="close" aria-label="閉じる">×</button>
  <div class="modal" id="modal"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
