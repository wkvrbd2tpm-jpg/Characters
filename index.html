<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラクター図鑑</title>
<meta name="description" content="オリジナルキャラクターの紹介ページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="yorkie-face" viewBox="0 0 300 160">
<symbol id="yorkie-sit" viewBox="0 0 300 160">
<symbol id="yorkie-long-loaf" viewBox="0 0 300 90">
<symbol id="yorkie-short-loaf" viewBox="0 0 300 110">
    <symbol id="paw" viewBox="0 0 100 100">
      <g fill="#e8a2b4">
        <ellipse cx="50" cy="67" rx="20" ry="16"/>
        <circle cx="25" cy="43" r="9"/><circle cx="41" cy="32" r="9.5"/>
        <circle cx="59" cy="32" r="9.5"/><circle cx="75" cy="43" r="9"/>
      </g>
    </symbol>
    <symbol id="poop" viewBox="0 0 100 100"><circle cx="34" cy="66" r="17" fill="#8a6844"/><circle cx="63" cy="62" r="19" fill="#7a5a36"/><circle cx="49" cy="42" r="13" fill="#8a6844"/><circle cx="45" cy="38" r="4" fill="#a37f52"/></symbol>
    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 88 C20 62 8 45 8 30 C8 16 18 8 30 8 C40 8 48 14 50 23 C52 14 60 8 70 8 C82 8 92 16 92 30 C92 45 80 62 50 88 Z" fill="#f2a9bf"/>
    </symbol>
  </defs>
</svg>
<header class="hero">
  <svg class="yorkie y-left" aria-hidden="true"><use href="#yorkie-face"/></svg>
  <svg class="yorkie y-right" aria-hidden="true"><use href="#yorkie-sit"/></svg>
  <svg class="paw-deco pd1" aria-hidden="true"><use href="#paw"/></svg>
  <svg class="paw-deco pd2" aria-hidden="true"><use href="#heart"/></svg>
  <svg class="paw-deco pd3" aria-hidden="true"><use href="#paw"/></svg>
  <div class="wrap">
    <p class="kicker">ORIGINAL CHARACTERS</p>
    <h1 id="site-title">キャラクター図鑑</h1>
    <p id="site-lead"></p>
    <div class="hero-rule" aria-hidden="true"><span></span></div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="表示切り替え">
    <button type="button" class="tab" data-tab="all" aria-selected="true">すべて</button>
    <button type="button" class="tab" data-tab="proxy" aria-selected="false">代理</button>
    <button type="button" class="tab" data-tab="plot" aria-selected="false">プロット</button>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="名前やタグで探す" aria-label="キャラクターを検索">
    <div class="chips" id="chips" aria-label="タグで絞り込み"></div>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap foot-in">
    <svg class="yorkie-foot" aria-hidden="true"><use href="#yorkie-sit"/></svg>
    <div>無断転載・無断使用はご遠慮ください。</div>
  </div>
</footer>

<dialog id="dlg" aria-label="キャラクター詳細">
  <button class="close" id="close" aria-label="閉じる">×</button>
  <div class="modal" id="modal"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
