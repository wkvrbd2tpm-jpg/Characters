<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推しプロット紹介</title>
<meta name="description" content="お気に入りのプロットを紹介するページ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261112z6">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="paw" viewBox="0 0 100 100">
      <g fill="#e8a2b4">
        <ellipse cx="50" cy="67" rx="20" ry="16"/>
        <circle cx="25" cy="43" r="9"/><circle cx="41" cy="32" r="9.5"/>
        <circle cx="59" cy="32" r="9.5"/><circle cx="75" cy="43" r="9"/>
      </g>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 88 C20 62 8 45 8 30 C8 16 18 8 30 8 C40 8 48 14 50 23 C52 14 60 8 70 8 C82 8 92 16 92 30 C92 45 80 62 50 88 Z" fill="#f2a9bf"/>
    </symbol>
  </defs>
</svg>
<header class="hero hero-sub">
  <img class="yorkie y-left" src="images/yorkie-tare.png" alt="" aria-hidden="true">
  <img class="yorkie y-right" src="images/yorkie-puupu.png" alt="" aria-hidden="true">
  <svg class="paw-deco pd1" aria-hidden="true"><use href="#paw"/></svg>
  <svg class="paw-deco pd2" aria-hidden="true"><use href="#heart"/></svg>
  <svg class="paw-deco pd3" aria-hidden="true"><use href="#paw"/></svg>
  <div class="wrap">
    <h1>推しプロット紹介</h1>
    <p>自分のプロットと、おすすめの素敵な作品のリンク集です。</p>
    <div class="hero-rule" aria-hidden="true"><span></span></div>
    <p class="back-line"><a class="back-link" href="index.html">← キャラクター一覧に戻る</a></p>
  </div>
</header>

<main class="wrap">
  <div class="plot-tabs" role="tablist" aria-label="プロットの種類">
    <button class="ptab" type="button" data-ptab="works" aria-selected="true">素敵な作品</button>
    <button class="ptab" type="button" data-ptab="mine" aria-selected="false">自プロット</button>
  </div>
  <section id="panel-works">
    <div class="plot-grid exhibit-grid" id="plot-grid" aria-live="polite"></div>
    <p class="empty" id="plot-empty" hidden></p>
  </section>
  <section id="panel-mine" hidden>
    <div class="own-grid exhibit-grid" id="own-grid"></div>
    <p class="empty" id="own-empty" hidden>プロットタグの付いたキャラクターがまだいません。</p>
  </section>
</main>

<footer>
  <div class="wrap foot-in">
    <img class="yorkie-foot" src="images/yorkie-puupu.png" alt="" aria-hidden="true">
    <div>無断転載・無断使用はご遠慮ください。</div>
  </div>
</footer>

<script src="plots.js?v=20261112g"></script>
<button id="to-top" type="button" aria-label="一番上に戻る">↑</button>
</body>
</html>
